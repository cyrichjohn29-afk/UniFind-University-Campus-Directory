
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniPlanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5fb;color:#26334c}
header{background:#4568dc;color:white;padding:25px}
main{max-width:850px;margin:30px auto;padding:20px}
.card{background:white;padding:22px;border-radius:16px;margin-bottom:18px;box-shadow:0 5px 20px #17233c10}
input,button{padding:12px;border-radius:9px;border:1px solid #ddd}
input{width:100%;margin:6px 0}
button{background:#4568dc;color:white;border:0;cursor:pointer}
.task{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid #eee}
.task span{flex:1}
.done{text-decoration:line-through;color:#999}
.actions{display:flex;gap:5px}
.actions button{padding:8px}
</style>
</head>
<body>
<header><h1>📚 UniPlanner</h1><p>Your everyday university organizer</p></header>
<main>
<div class="card">
<h2>Add a task</h2>
<input id="task" placeholder="Task name">
<input id="date" type="date">
<button onclick="addTask()">+ Add Task</button>
</div>
<div class="card">
<h2>My Tasks</h2>
<div id="tasks"></div>
</div>
</main>
<script>
let tasks=JSON.parse(localStorage.tasks||"[]");
function save(){localStorage.tasks=JSON.stringify(tasks);render()}
function addTask(){
let name=document.getElementById('task').value.trim();
if(!name)return alert('Enter a task!');
tasks.push({name,date:document.getElementById('date').value,done:false});
document.getElementById('task').value='';
save();
}
function editTask(i){
let n=prompt('Edit task:',tasks[i].name);
if(n&&n.trim()){tasks[i].name=n.trim();save()}
}
function removeTask(i){
if(confirm('Delete this task?')){tasks.splice(i,1);save()}
}
function render(){
document.getElementById('tasks').innerHTML=tasks.map((t,i)=>`
<div class="task">
<input type="checkbox" style="width:auto" ${t.done?'checked':''} onchange="tasks[${i}].done=this.checked;save()">
<span class="${t.done?'done':''}">${escapeHTML(t.name)}<br><small>${escapeHTML(t.date||'No deadline')}</small></span>
<div class="actions">
<button onclick="editTask(${i})">Edit</button>
<button onclick="removeTask(${i})">Delete</button>
</div></div>`).join('')||'<p>No tasks yet. Add your first task!</p>';
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
</body>
</html>
